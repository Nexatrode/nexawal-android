MaintainerNotes: |
  Native Monero core is rebuilt from the MoneroWalletCoreFFI submodule by the
  default Gradle path (do not package committed .so files).
  The RPC endpoint is configurable. Fiat rates and transaction explorer lookups
  are optional and disabled by default; review network AntiFeatures against the
  actual release behavior rather than assuming a fixed service dependency.
  Privacy policy: https://nexawal.com/privacy/
  The 1.0.2 build entry is provisional; update its commit to the exact
  QA-approved release revision before filing an F-Droid inclusion request.
  See docs/FDROID.md and docs/REPRODUCIBLE_BUILD.md in the app repo.
  minSdk is 30.

