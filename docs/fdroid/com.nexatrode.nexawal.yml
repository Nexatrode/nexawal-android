Builds:
  - versionName: 1.0.5
    versionCode: 7
    commit: 6af1f9e30b9e81077990254cceba91eb26a302d9
    submodules: true
    rm:
      - MoneroWalletCoreFFI/monero-oxide-output/resp.bin
    sudo:
      - apt-get update
      - apt-get install -y build-essential protobuf-compiler
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    build:
      - $$rustup$$/rustup-init.sh -y --no-modify-path --default-toolchain 1.97.1
      - "${CARGO_HOME:-$HOME/.cargo}/bin/rustup target add --toolchain 1.97.1 aarch64-linux-android x86_64-linux-android"
    ndk: 27.1.12297006

MaintainerNotes: |
  Native Monero core is rebuilt from the MoneroWalletCoreFFI submodule by the
  default Gradle path (do not package committed .so files).
  The RPC endpoint is configurable. Fiat rates and transaction explorer lookups
  are optional and disabled by default; review network AntiFeatures against the
  actual release behavior rather than assuming a fixed service dependency.
  Privacy policy: https://nexawal.com/privacy/
  The 1.0.5 entry pins the Play-submitted Android source commit (versionCode 7).
  A clean F-Droid buildserver-trixie Docker build passed on 2026-10-23 from this
  exact commit; the resulting APK is unsigned for F-Droid to sign.
  See docs/FDROID.md and docs/REPRODUCIBLE_BUILD.md in the app repo.
  minSdk is 30.

ArchivePolicy: 2
AutoUpdateMode: Version
UpdateCheckMode: Tags
